name: Publish Airi Android model
on:
  workflow_dispatch:
  schedule:
    - cron: '36 */4 * * *'
  push:
    branches: [main]
    paths:
      - 'mobile/model/**'
      - '.github/workflows/publish-android-model.yml'
permissions:
  contents: write
concurrency:
  group: airi-android-model
  cancel-in-progress: false

jobs:
  publish:
    if: github.repository == 'arancione3000/airi-offline-training' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 16
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore the native runtime
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/arancione3000/airi-pc-bootstrap.git "$RUNNER_TEMP/airi-native"
          git -C "$RUNNER_TEMP/airi-native" sparse-checkout set computer
          git -C "$RUNNER_TEMP/airi-native" checkout --detach d078e718dfba0d68babd31de90fa55c0beac1951
      - name: Install the CPU exporter
        run: |
          python -m pip install torch==2.14.1+cpu --index-url https://download.pytorch.org/whl/cpu
          python -m pip install onnx==1.20.1 onnxruntime==1.23.2
      - name: Export and publish only approved weights
        run: |
          export PYTHONPATH="$RUNNER_TEMP/airi-native/computer"
          python mobile/model/publish_model.py "$RUNNER_TEMP/android-model" --publish
