name: AIRI continuous recovery watchdog
on:
  workflow_run:
    workflows: ['AIRI continuous training supervisor']
    types: [completed]
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: airi-continuous-supervisor
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify autonomous recovery contracts
        run: python -m unittest discover -s tests/continuous-controller -v
      - name: Recover one service transition independently of the watcher
        run: python scripts/continuous-training/controller.py tick
