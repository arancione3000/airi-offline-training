name: Verify offline runner
on:
  push:
    paths:
      - 'scripts/offline-training/**'
      - 'tests/offline-training/**'
      - '.github/workflows/*offline*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/offline-training -v
      - run: python -m py_compile scripts/offline-training/*.py
