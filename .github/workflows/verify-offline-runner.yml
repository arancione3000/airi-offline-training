name: Verify offline runner
on:
  push:
    paths:
      - 'scripts/offline-training/**'
      - 'tests/offline-training/**'
      - 'scripts/recovery-training/**'
      - 'tests/recovery-training/**'
      - 'scripts/expanded-training/**'
      - 'tests/expanded-training/**'
      - 'scripts/conversation-training/**'
      - 'tests/conversation-training/**'
      - 'scripts/transfer-training/**'
      - 'tests/transfer-training/**'
      - '.github/workflows/airi-transfer-background.yml'
      - 'scripts/focused-training/**'
      - 'tests/focused-training/**'
      - '.github/workflows/airi-focused-background.yml'
      - 'scripts/noon-training/**'
      - 'tests/noon-training/**'
      - '.github/workflows/airi-noon-background.yml'
      - 'scripts/evolving-training/**'
      - 'tests/evolving-training/**'
      - '.github/workflows/airi-evolving-background.yml'
      - 'scripts/stable-training/**'
      - 'tests/stable-training/**'
      - '.github/workflows/airi-stable-background.yml'
      - 'scripts/afternoon-training/**'
      - 'tests/afternoon-training/**'
      - '.github/workflows/airi-afternoon-background.yml'
      - 'scripts/overnight-training/**'
      - 'tests/overnight-training/**'
      - '.github/workflows/airi-overnight-background.yml'
      - 'scripts/autonomous-control/**'
      - 'tests/autonomous-control/**'
      - '.github/workflows/airi-training-watchdog.yml'
      - '.github/workflows/airi-conversation-background.yml'
      - '.github/workflows/airi-expanded-background.yml'
      - '.github/workflows/airi-recovery-background.yml'
      - '.github/workflows/*offline*.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests/offline-training -v
      - run: python -m py_compile scripts/offline-training/*.py
      - run: python -m unittest discover -s tests/recovery-training -v
      - run: python -m py_compile scripts/recovery-training/*.py
      - run: python -m unittest discover -s tests/expanded-training -v
      - run: python -m py_compile scripts/expanded-training/*.py
      - run: python -m unittest discover -s tests/conversation-training -v
      - run: python -m py_compile scripts/conversation-training/*.py
      - run: python -m unittest discover -s tests/autonomous-control -v
      - run: python -m py_compile scripts/autonomous-control/*.py
      - run: python -m unittest discover -s tests/overnight-training -v
      - run: python -m py_compile scripts/overnight-training/*.py
      - run: python -m unittest discover -s tests/afternoon-training -v
      - run: python -m py_compile scripts/afternoon-training/*.py
      - run: python -m unittest discover -s tests/stable-training -v
      - run: python -m py_compile scripts/stable-training/*.py
      - run: python -m unittest discover -s tests/evolving-training -v
      - run: python -m py_compile scripts/evolving-training/*.py
      - run: python -m unittest discover -s tests/noon-training -v
      - run: python -m py_compile scripts/noon-training/*.py
      - run: python -m unittest discover -s tests/focused-training -v
      - run: python -m py_compile scripts/focused-training/*.py
      - run: python -m unittest discover -s tests/transfer-training -v
      - run: python -m py_compile scripts/transfer-training/*.py
