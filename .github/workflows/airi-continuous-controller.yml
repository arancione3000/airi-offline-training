name: AIRI continuous training supervisor
on:
  workflow_run:
    workflows: ['*']
    branches: [native-continuous-learning-20261105]
    types: [completed]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: airi-continuous-supervisor
  cancel-in-progress: false
jobs:
  supervise:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.path == '.github/workflows/airi-continuous-background.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify continuation and exclusive-dispatch contracts
        run: python -m unittest discover -s tests/continuous-controller -v
      - name: Resume the enabled service from committed state
        run: python scripts/continuous-training/controller.py watch | tee -a "$GITHUB_STEP_SUMMARY"
