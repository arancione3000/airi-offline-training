name: Verify experimental Airi assistant and modular growth
on:
  push:
    paths:
      - 'scripts/assistant-runtime/**'
      - 'tests/assistant-runtime/**'
      - 'scripts/research-training/modular-growth-20261116/**'
      - '.github/workflows/verify-assistant-runtime.yml'
      - '.github/workflows/airi-modular-auto-update.yml'
      - '.github/workflows/airi-modular-supervisor.yml'
      - '.github/workflows/airi-query-research.yml'
      - 'scripts/research-training/semantic-routing-20261116/**'
      - 'scripts/research-training/intent-transfer-20261120/**'
      - 'scripts/research-training/exact-transfer-20261120/**'
      - 'scripts/research-training/joint-action-20261121/**'
      - 'scripts/research-training/certified-procedure-transfer/**'
      - 'scripts/research-training/incremental-procedure-verification/**'
      - 'scripts/research-training/procedural-capacity-growth/**'
      - 'scripts/research-training/native-capacity-growth/**'
  pull_request:
    paths:
      - 'scripts/assistant-runtime/**'
      - 'tests/assistant-runtime/**'
      - 'scripts/research-training/modular-growth-20261116/**'
      - '.github/workflows/verify-assistant-runtime.yml'
      - '.github/workflows/airi-modular-auto-update.yml'
      - '.github/workflows/airi-modular-supervisor.yml'
      - '.github/workflows/airi-query-research.yml'
      - 'scripts/research-training/semantic-routing-20261116/**'
      - 'scripts/research-training/intent-transfer-20261120/**'
      - 'scripts/research-training/exact-transfer-20261120/**'
      - 'scripts/research-training/joint-action-20261121/**'
      - 'scripts/research-training/certified-procedure-transfer/**'
      - 'scripts/research-training/incremental-procedure-verification/**'
      - 'scripts/research-training/procedural-capacity-growth/**'
      - 'scripts/research-training/native-capacity-growth/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify memory precision, boundaries, provenance and actual CLI
        run: python -m unittest discover -s tests/assistant-runtime -v
      - name: Check donor selection and rejection of conflicting proposals
        run: python -m unittest discover -s scripts/research-training/intent-transfer-20261120 -v
      - name: Verify shared procedural learning and retention
        run: |
          python -m unittest discover -s scripts/research-training/certified-procedure-transfer -v
          python scripts/research-training/certified-procedure-transfer/trial.py "$RUNNER_TEMP/certified-procedure-transfer"
      - name: Verify incremental procedure updates
        run: |
          python -m unittest discover -s scripts/research-training/incremental-procedure-verification -v
          python scripts/research-training/incremental-procedure-verification/benchmark.py "$RUNNER_TEMP/incremental-procedure-verification.json" --repeats 1
          python scripts/research-training/incremental-procedure-verification/synthesis.py --output "$RUNNER_TEMP/incremental-procedure-synthesis.json"
      - name: Verify automatic procedural capacity growth
        run: |
          python -m unittest discover -s scripts/research-training/procedural-capacity-growth -v
          python scripts/research-training/procedural-capacity-growth/synthesis_growth.py "$RUNNER_TEMP/procedural-capacity-growth.json"
          python scripts/research-training/procedural-capacity-growth/fresh_coverage.py "$RUNNER_TEMP/procedural-capacity-fresh.json"
          cmp "$RUNNER_TEMP/procedural-capacity-fresh.json" scripts/research-training/procedural-capacity-growth/evidence/FRESH.json
          python scripts/research-training/procedural-capacity-growth/replay_cycle.py "$RUNNER_TEMP/procedural-capacity-restart"
          python scripts/research-training/procedural-capacity-growth/chat_probe.py "$RUNNER_TEMP/procedural-capacity-chat"
          python scripts/research-training/native-capacity-growth/selection.py
      - name: Verify independent functionality and inherited native preservation
        run: |
          python scripts/assistant-runtime/evaluate.py --output assistant-ci --prepare-only --seed 202611152254
          python - <<'PY'
          import gzip
          from pathlib import Path
          Path('assistant-ci/ledger.json').write_bytes(gzip.decompress(Path('tests/assistant-runtime/fixtures/retention_contract.json.gz').read_bytes()))
          PY
          python scripts/assistant-runtime/evaluate.py --output assistant-ci --legacy-report scripts/research-training/learnability-20261115/evidence/REPORT.json.gz --ledger assistant-ci/ledger.json
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('assistant-ci/REPORT.json').read_text())
          assert r['composed_memory_gates_passed']
          assert r['legacy92']['previously_correct_lost']==0
          assert r['certified897']['total']==897 and r['certified897']['lost']==0
          PY
      - name: Replay modular learning, independent values, persistence and old routing
        run: |
          python scripts/research-training/modular-growth-20261116/curriculum.py --out modular-ci-input
          python scripts/research-training/modular-growth-20261116/run_growth.py --curriculum modular-ci-input --output modular-ci-output
