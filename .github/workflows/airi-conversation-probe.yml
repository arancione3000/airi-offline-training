name: AIRI offline conversation probe
on:
  workflow_dispatch:
    inputs:
      checkpoint_release:
        description: 'Verified FP32 offline checkpoint to test without training'
        required: true
        default: airi-offline-35635-37785750755-1-3
        type: string
permissions:
  contents: write
concurrency:
  group: airi-offline-conversation-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      CHECKPOINT_RELEASE: ${{ inputs.checkpoint_release }}
      PYTHONPATH: ${{ github.workspace }}/source/computer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: arancione3000/airi-pc-bootstrap
          ref: d078e718dfba0d68babd31de90fa55c0beac1951
          path: source
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU runtime
        run: |
          python -m pip install 'torch==2.14.1+cpu' --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'numpy>=2,<3'
          git -C source apply --include='computer/*' ../scripts/offline-training/recovery.patch
      - name: Probe verified snapshot without training
        run: |
          python scripts/conversation-evaluation/probe.py --release "$CHECKPOINT_RELEASE" --root conversation-work
